# Local development infrastructure.
#   npm run infra:up          → PostgreSQL (pgvector) + Redis
#   docker compose up -d ai   → also the CV service on :8000
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: saarthi
      POSTGRES_PASSWORD: saarthi
      POSTGRES_DB: saarthi
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saarthi"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  ai:
    build:
      context: ./ai-service
      target: runtime
    environment:
      APP_ENV: development
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    ports: ["8000:8000"]

volumes:
  pgdata:
